# 로컬 기동 — sqlite 한 파일, 서비스 하나. PostgreSQL 은 여기서 띄우지 않는다.
#
# 왜 DB 컨테이너가 없나: remote 모드는 **이미 있는 DB 를 읽기 전용으로 보는** 용도이고, 그
# 접속은 SSH 터널을 통해 온다. compose 가 빈 postgres 를 하나 더 띄우면 "어느 쪽이 진짜 데이터인가"
# 를 만드는 것뿐이다. 원격을 볼 때는 터널을 띄운 뒤 DATABASE_URL 만 넘긴다.
#
#   ssh -N -L 15432:<db-host>:5432 <user>@<your-host>
#   USAGE_DB_MODE=remote DATABASE_URL=postgres://usage_app:…@127.0.0.1:15432/usage docker compose up

services:
  usage:
    build: .
    image: user-usage:local
    restart: unless-stopped

    # 토큰은 파일로 넘긴다. compose 파일에 직접 쓰면 그대로 커밋된다.
    env_file:
      - .env

    environment:
      USAGE_HOST: "0.0.0.0"
      USAGE_PORT: "4191"
      USAGE_DATA_DIR: /data

    # **127.0.0.1 에 묶는다.** `- "4191:4191"` 로 쓰면 도커가 호스트 방화벽을 우회해 LAN 전체에
    # 연다 — 이 화면은 사람별 사용량과 비용을 담고 있어서 그 기본값을 쓰지 않는다.
    # 원격에서 봐야 하면 SSH 포트포워딩으로 가져간다.
    ports:
      - "127.0.0.1:4191:4191"

    # sqlite 파일. 이게 없으면 컨테이너를 재생성할 때마다 사용량이 통째로 사라진다.
    volumes:
      - usage-data:/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4191/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # 이 서비스는 파일 쓰기가 /data 하나뿐이다 — 나머지는 읽기 전용으로 잠근다.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  usage-data:
