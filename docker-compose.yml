# 로컬 기동 — sqlite 한 파일, 서비스 하나. PostgreSQL 은 여기서 띄우지 않는다.
#
# 왜 DB 컨테이너가 없나: remote 모드는 **이미 있는 DB 를 읽기 전용으로 보는** 용도이고, 그
# 접속은 SSH 터널을 통해 온다. compose 가 빈 postgres 를 하나 더 띄우면 "어느 쪽이 진짜 데이터인가"
# 를 만드는 것뿐이다. 원격을 볼 때는 터널을 띄운 뒤 DATABASE_URL 만 넘긴다.
#
#   ssh -N -L 15432:<db-host>:5432 <user>@<your-host>
#   USAGE_DB_MODE=remote DATABASE_URL=postgres://usage_app:…@127.0.0.1:15432/usage docker compose up

services:
  usage:
    build: .
    image: user-usage:local
    restart: unless-stopped

    # 토큰은 파일로 넘긴다. compose 파일에 직접 쓰면 그대로 커밋된다(.env 는 .gitignore 에 있다).
    env_file:
      - .env

    environment:
      USAGE_HOST: "0.0.0.0"
      USAGE_PORT: "4191"
      USAGE_DATA_DIR: /data

    # **127.0.0.1 에 묶는다.** `- "4191:4191"` 로 쓰면 도커가 호스트 방화벽을 우회해 LAN 전체에
    # 연다 — 이 화면은 사람별 사용량과 비용을 담고 있어서 그 기본값을 쓰지 않는다.
    # 원격에서 봐야 하면 SSH 포트포워딩으로 가져간다.
    ports:
      - "127.0.0.1:4191:4191"

    # sqlite 파일. 이게 없으면 컨테이너를 재생성할 때마다 사용량이 통째로 사라진다.
    volumes:
      - usage-data:/data

    # /healthz 를 HTTP 로 직접 프로브한다 — 무인증·무DB 경로라 토큰 없이 200 이다.
    # **Node 의존을 걷어냈다**(이미지에 Node 가 없다). 프로브는 알파인 런타임에 기본 내장된
    # busybox wget 으로 한다 — 별도 도구도, go 바이너리 서브커맨드도 필요 없다.
    #   ⚠ 이미지 베이스가 wget 없는 것(scratch·distroless)으로 바뀌면 이 test 는 못 돈다.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4191/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # 이 서비스는 파일 쓰기가 /data 하나뿐이다 — 루트 파일시스템은 읽기 전용으로 잠근다.
    # sqlite 의 WAL/SHM 도 /data 안에 떨어지므로 read_only 와 충돌하지 않는다.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  usage-data:
